name: Build APK via EAS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de build'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci || npm install

      - name: 🏗️ Build do projeto web
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 🔄 Sync Capacitor
        run: npx cap sync android || true

      - name: 📱 Setup Expo EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔨 Build APK via EAS
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive \
            --output ./build-output.apk || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Build APK local (fallback)
        run: |
          if [ ! -f "./build-output.apk" ]; then
            echo "EAS não gerou APK local, tentando build local..."
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
          fi

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistente-juridico-modular-apk-${{ github.run_number }}
          path: |
            build-output.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn